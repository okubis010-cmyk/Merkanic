crons:
  - name: apk-reminders
    description: "Mailt klanten dagelijks om 08:00 als hun APK binnen 30 dagen verloopt"
    cron: "0 8 * * *"
    timezone: "Europe/Amsterdam"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/apk-reminders"
    method: POST
    enabled: true
